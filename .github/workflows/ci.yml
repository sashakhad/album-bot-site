name: CI

on:
  pull_request:
  push:
    branches:
      - main

# The site is static. Prisma generate and next build must succeed
# with DATABASE_URL and SHADOW_DATABASE_URL unset.
jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
